name: harness-check

on:
  pull_request:
    branches: [main]

jobs:
  line-endings:
    name: Executable line ending check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check shell and Python scripts use LF
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          paths = subprocess.check_output(
              ["git", "-c", "core.quotePath=false", "ls-files", "--", "*.sh", "*.bash", "*.py"],
              text=True,
          ).splitlines()

          bad = []
          for raw_path in paths:
              try:
                  blob = subprocess.check_output(
                      ["git", "cat-file", "blob", f"HEAD:{raw_path}"]
                  )
              except (subprocess.CalledProcessError, OSError) as e:
                  print(f"WARNING: could not read blob {raw_path}: {e}", file=sys.stderr)
                  continue
              if b"\r" in blob:
                  bad.append(raw_path)

          if bad:
              print("ERROR: executable text files must use LF line endings:")
              for path in bad:
                  print(f"  {path}")
              print("Fix with .gitattributes and git add --renormalize.")
              sys.exit(1)

          print("OK: executable text files use LF line endings.")
          PY

  json-encoding:
    name: JSON BOM check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check JSON files carry no UTF-8 BOM
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          paths = subprocess.check_output(
              ["git", "-c", "core.quotePath=false", "ls-files", "--", "*.json"],
              text=True,
          ).splitlines()

          bad = [p for p in paths if open(p, "rb").read(3) == b"\xef\xbb\xbf"]

          if bad:
              print("ERROR: JSON files must be UTF-8 with no BOM — strict parsers reject the leading EF BB BF:")
              for path in bad:
                  print(f"  {path}")
              print("Cause: Windows PowerShell 5.1 Out-File/Set-Content -Encoding utf8 writes a BOM.")
              print("Fix: rewrite the file without the first 3 bytes (git bash, or an editor set to UTF-8 without BOM).")
              sys.exit(1)

          print(f"OK: {len(paths)} tracked JSON files are BOM-free.")
          PY

  harness-drift:
    name: Plugin-root portability + capture-before-use + section-ref check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run scripts/ci/test_check_harness_drift.py
        run: python3 scripts/ci/test_check_harness_drift.py

      - name: Run scripts/ci/check_harness_drift.py
        run: python3 scripts/ci/check_harness_drift.py

  changelog-entries:
    name: CHANGELOG Entry Contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run scripts/ci/test_check_changelog_entries.py
        run: python3 scripts/ci/test_check_changelog_entries.py

      - name: Run scripts/ci/check_changelog_entries.py
        run: python3 scripts/ci/check_changelog_entries.py

  ruff:
    name: Ruff lint (pinned ruleset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Pinned: an unpinned ruff release could widen the ruleset ruff.toml scopes
      # and break CI on untouched code. Keep in sync with the local
      # .git/hooks/pre-commit gate, which is untracked and per-machine.
      - name: Install ruff
        run: python3 -m pip install --quiet 'ruff==0.16.0'

      # `.python-version` and ruff.toml's `target-version` are two spellings of the
      # same floor, and NOTHING in the toolchain reconciles them: ruff never reads
      # `.python-version`, and setup-python only picks the interpreter that runs pip.
      # Left unchecked they drift silently — bumping one while the other stays put
      # goes unnoticed. Assert they agree so the doc's claim is actually enforced.
      - name: Assert .python-version matches ruff target-version
        run: |
          floor="py$(tr -d '.[:space:]' < .python-version)"
          target=$(grep -E '^target-version' ruff.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$floor" != "$target" ]; then
            echo "ERROR: .python-version ($floor) != ruff.toml target-version ($target)."
            echo "Both record the repo's Python floor — bump them together."
            exit 1
          fi
          echo "OK: Python floor $floor agrees with ruff target-version."

      # Repo-wide, not just the hook's */scripts/*.py scope. The repo sits at 0
      # violations everywhere, and repo-wide is what mechanically enforces
      # ruff.toml's target-version: lowering it below py312 makes ruff's
      # version-aware parser report 6 E9 invalid-syntax errors on the PEP 701
      # f-strings in prod/skills/hwpx/scripts/table.py. Until this job existed
      # that floor was asserted in a comment alone.
      - name: Run ruff check
        run: ruff check --no-cache .

  commit-and-push-test:
    name: commit-and-push.sh regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Run dev/hooks/commit-guard/guard.py --test
        run: python3 dev/hooks/commit-guard/guard.py --test

      - name: Run dev/hooks/memory-guard/guard.py --test
        run: python3 dev/hooks/memory-guard/guard.py --test

      - name: Run dev/skills/task-review-cycle/scripts/test_commit_and_push.py
        run: python3 dev/skills/task-review-cycle/scripts/test_commit_and_push.py

      - name: Run dev/skills/task-review-cycle/scripts/test_ci_wait.py
        run: python3 dev/skills/task-review-cycle/scripts/test_ci_wait.py

      # Cache hits are asserted by counting hub.sh calls, so this needs no network and no gh.
      - name: Run dev/skills/task-review-cycle/scripts/test_preflight.py
        run: python3 dev/skills/task-review-cycle/scripts/test_preflight.py

      # Covers both probe branches on a Linux runner: the platform selector is env-overridable, and
      # the Windows case stubs `tasklist` on PATH — which is what pins the `/NH` vs `//NH` flag form
      # whose failure silently disables the prune on MINGW.
      - name: Run dev/skills/task-review-cycle/scripts/test_codex_review.py
        run: python3 dev/skills/task-review-cycle/scripts/test_codex_review.py

      # Guards the Sprint Contract argument against shell injection, and the prompt
      # assembly against the bash 3.2 heredoc trap that CI's bash 5 cannot reproduce.
      - name: Run dev/skills/task-review-cycle/scripts/test_claude_review.py
        run: python3 dev/skills/task-review-cycle/scripts/test_claude_review.py

  task-nodes-test:
    name: task_nodes.py regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Both task-next and task-new invoke this one copy; a break here breaks both cycles.
      - name: Run dev/skills/task-next/scripts/task_nodes.py --test
        run: python3 dev/skills/task-next/scripts/task_nodes.py --test

      - name: Run dev/skills/harness-curate/scripts/record_run.py --test
        run: python3 dev/skills/harness-curate/scripts/record_run.py --test

      # Owns the harness-capture note-store contract: mandatory fields, the hygiene
      # rejections, and the NO-STORE/EMPTY/PENDING exit codes the skill branches on.
      - name: Run dev/skills/harness-capture/scripts/session_notes.py --test
        run: python3 dev/skills/harness-capture/scripts/session_notes.py --test

  bump-version-test:
    name: bump-version.sh regression test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Builds its own CRLF fixture, so this catches the Windows-only no-op even
      # though the runner checks out LF.
      - name: Run scripts/ci/test_bump_version.py
        run: python3 scripts/ci/test_bump_version.py

  skill-frontmatter:
    name: Skill/agent/command frontmatter check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Run scripts/ci/test_check_skill_frontmatter.py
        run: python3 scripts/ci/test_check_skill_frontmatter.py

      - name: Run scripts/ci/check_skill_frontmatter.py
        run: python3 scripts/ci/check_skill_frontmatter.py

  skill-size:
    name: SKILL.md line-count cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run scripts/ci/check_skill_size.py --test
        run: python3 scripts/ci/check_skill_size.py --test

      - name: Run scripts/ci/check_skill_size.py
        run: python3 scripts/ci/check_skill_size.py

  asset-hygiene:
    name: Shipped-asset hygiene check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run scripts/ci/test_check_asset_hygiene.py
        run: python3 scripts/ci/test_check_asset_hygiene.py

      - name: Run scripts/ci/check_asset_hygiene.py
        run: python3 scripts/ci/check_asset_hygiene.py

  skill-triggers:
    name: Skill trigger-fixture ranking check
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the ratchet's `git diff origin/main...HEAD` has its base
      # (same reason the version-bump job below fetches full history).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Run scripts/ci/test_check_skill_triggers.py
        run: python3 scripts/ci/test_check_skill_triggers.py

      - name: Run scripts/ci/check_skill_triggers.py
        run: python3 scripts/ci/check_skill_triggers.py

  version-bump:
    name: Plugin version bump check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check dev version bumped
        run: |
          ver_gt() {
            local IFS=.
            read -r a1 a2 a3 <<< "$1"
            read -r b1 b2 b3 <<< "$2"
            [ "$a1" -gt "$b1" ] && return 0
            [ "$a1" -lt "$b1" ] && return 1
            [ "$a2" -gt "$b2" ] && return 0
            [ "$a2" -lt "$b2" ] && return 1
            [ "$a3" -gt "$b3" ]
          }
          CHANGED=$(git diff origin/main...HEAD -- dev/ | grep -c '^+\|^-' || true)
          if [ "$CHANGED" -gt 0 ]; then
            if ! git cat-file -e "origin/main:dev/.claude-plugin/plugin.json" 2>/dev/null; then
              echo "OK: dev/ is new or renamed on this branch (no manifest on origin/main) - skipping version-increment check."
              exit 0
            fi
            OLD_CLAUDE=$(git show origin/main:dev/.claude-plugin/plugin.json | jq -r .version)
            OLD_CODEX=$(git show origin/main:dev/.codex-plugin/plugin.json | jq -r .version)
            NEW_CLAUDE=$(jq -r .version dev/.claude-plugin/plugin.json)
            NEW_CODEX=$(jq -r .version dev/.codex-plugin/plugin.json)
            for v in OLD_CLAUDE OLD_CODEX NEW_CLAUDE NEW_CODEX; do
              eval "val=\$$v"
              [ "$val" = "null" ] && { echo "ERROR: dev $v version key missing in manifest."; exit 1; }
            done
            if [ "$OLD_CLAUDE" = "$NEW_CLAUDE" ] && [ "$OLD_CODEX" = "$NEW_CODEX" ]; then
              echo "ERROR: dev/ changed but neither manifest bumped ($NEW_CLAUDE)."
              echo "See docs/conventions.md for semver rules."
              exit 1
            fi
            if [ "$OLD_CLAUDE" = "$NEW_CLAUDE" ]; then
              echo "ERROR: dev Codex bumped ($OLD_CODEX->$NEW_CODEX) but Claude manifest not ($NEW_CLAUDE). Bump both in sync."
              exit 1
            fi
            if [ "$OLD_CODEX" = "$NEW_CODEX" ]; then
              echo "ERROR: dev Claude bumped ($OLD_CLAUDE->$NEW_CLAUDE) but Codex manifest not ($NEW_CODEX). Bump both in sync."
              exit 1
            fi
            if [ "$NEW_CLAUDE" != "$NEW_CODEX" ]; then
              echo "ERROR: dev manifests out of sync: .claude-plugin ($NEW_CLAUDE) != .codex-plugin ($NEW_CODEX)."
              exit 1
            fi
            if ! ver_gt "$NEW_CLAUDE" "$OLD_CLAUDE"; then
              echo "ERROR: dev version did not increase ($OLD_CLAUDE -> $NEW_CLAUDE). Bumps must be a strict SemVer increment."
              exit 1
            fi
            echo "OK: dev version bumped ($OLD_CLAUDE -> $NEW_CLAUDE), both manifests in sync."
          else
            echo "SKIP: dev/ not changed."
          fi

      - name: Check prod version bumped
        run: |
          ver_gt() {
            local IFS=.
            read -r a1 a2 a3 <<< "$1"
            read -r b1 b2 b3 <<< "$2"
            [ "$a1" -gt "$b1" ] && return 0
            [ "$a1" -lt "$b1" ] && return 1
            [ "$a2" -gt "$b2" ] && return 0
            [ "$a2" -lt "$b2" ] && return 1
            [ "$a3" -gt "$b3" ]
          }
          CHANGED=$(git diff origin/main...HEAD -- prod/ | grep -c '^+\|^-' || true)
          if [ "$CHANGED" -gt 0 ]; then
            if ! git cat-file -e "origin/main:prod/.claude-plugin/plugin.json" 2>/dev/null; then
              echo "OK: prod/ is new or renamed on this branch (no manifest on origin/main) - skipping version-increment check."
              exit 0
            fi
            OLD_CLAUDE=$(git show origin/main:prod/.claude-plugin/plugin.json | jq -r .version)
            OLD_CODEX=$(git show origin/main:prod/.codex-plugin/plugin.json | jq -r .version)
            NEW_CLAUDE=$(jq -r .version prod/.claude-plugin/plugin.json)
            NEW_CODEX=$(jq -r .version prod/.codex-plugin/plugin.json)
            for v in OLD_CLAUDE OLD_CODEX NEW_CLAUDE NEW_CODEX; do
              eval "val=\$$v"
              [ "$val" = "null" ] && { echo "ERROR: prod $v version key missing in manifest."; exit 1; }
            done
            if [ "$OLD_CLAUDE" = "$NEW_CLAUDE" ] && [ "$OLD_CODEX" = "$NEW_CODEX" ]; then
              echo "ERROR: prod/ changed but neither manifest bumped ($NEW_CLAUDE)."
              echo "See docs/conventions.md for semver rules."
              exit 1
            fi
            if [ "$OLD_CLAUDE" = "$NEW_CLAUDE" ]; then
              echo "ERROR: prod Codex bumped ($OLD_CODEX->$NEW_CODEX) but Claude manifest not ($NEW_CLAUDE). Bump both in sync."
              exit 1
            fi
            if [ "$OLD_CODEX" = "$NEW_CODEX" ]; then
              echo "ERROR: prod Claude bumped ($OLD_CLAUDE->$NEW_CLAUDE) but Codex manifest not ($NEW_CODEX). Bump both in sync."
              exit 1
            fi
            if [ "$NEW_CLAUDE" != "$NEW_CODEX" ]; then
              echo "ERROR: prod manifests out of sync: .claude-plugin ($NEW_CLAUDE) != .codex-plugin ($NEW_CODEX)."
              exit 1
            fi
            if ! ver_gt "$NEW_CLAUDE" "$OLD_CLAUDE"; then
              echo "ERROR: prod version did not increase ($OLD_CLAUDE -> $NEW_CLAUDE). Bumps must be a strict SemVer increment."
              exit 1
            fi
            echo "OK: prod version bumped ($OLD_CLAUDE -> $NEW_CLAUDE), both manifests in sync."
          else
            echo "SKIP: prod/ not changed."
          fi
